<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление ESP32</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: white; padding-top: 50px; }
        .status-box { padding: 20px; font-size: 24px; margin: 20px auto; width: 80%; max-width: 400px; border-radius: 10px; background: #333; }
        .info { color: #888; font-size: 14px; }
    </style>
</head>
<body>

    <h2>🎛️ Панель управления IoT</h2>
    
    <!-- Вот этот блок со словом будет искать наша ESP32 -->
    <div class="status-box">
        Текущая команда: <b id="cmd">включить</b>
    </div>

    <p class="info">Чтобы изменить команду, отредактируйте этот файл на GitHub, вписав "включить" или "выключить".</p>

</body>
</html>
